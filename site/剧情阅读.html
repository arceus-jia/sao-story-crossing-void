<header><h1>零境交错 · 剧情阅读</h1><nav aria-label="阅读导航"><a href="index.html">分享首页</a><a href="心象画册.html">心象画册</a><a href="文案/中文/README.md" target="_blank" rel="noopener">中文文案</a><a href="文案/English/README.md" target="_blank" rel="noopener">English 文案</a><a class="text-download" href="downloads/sao-story-crossing-void-texts.zip" download="sao-story-crossing-void-texts.zip">下载文案 ZIP</a></nav></header>

<div class="shell" id="reading"><aside class="sidebar"><label class="visually-hidden" for="story-search">搜索剧情、角色或对白</label><input id="story-search" type="search" placeholder="搜索剧情、角色或对白"><label class="visually-hidden" for="story-category">剧情分类</label><select id="story-category"><option value="">全部剧情</option><option>主线剧情</option><option>活动与支线剧情</option><option>测试剧情</option><option>独立片段</option></select><div class="count" id="story-count" aria-live="polite"></div><div id="scene-list"></div></aside><main class="reader" id="reader"></main></div>
<main class="gallery" id="gallery" hidden><div class="kicker">素材索引 · 与剧情互相跳转</div><h2>剧情里使用的图片</h2><p class="muted">包括背景、少量剧情插图与特写、文字图、角色资料和演出分片。图集和效果纹理是原始组成素材，不能视为完整 CG。</p><div class="gallery-tools"><label class="visually-hidden" for="image-search">搜索图片或关联剧情</label><input id="image-search" type="search" placeholder="搜索素材名、角色或关联剧情"><label class="visually-hidden" for="image-category">图片用途</label><select id="image-category"><option value="">全部图片用途</option></select></div><div class="count" id="image-count" aria-live="polite"></div><div class="image-grid" id="gallery-grid"></div><div class="pager"><button id="previous-page">上一页</button><span id="page-count"></span><button id="next-page">下一页</button></div></main>

<script>
'use strict';
const V=window.CV_VOICES||{lines:{},clips:{}},D=window.CV_STORY,$=id=>document.getElementById(id),assets=new Map(D.assets.map(a=>[a.id,a])),scenes=new Map(D.scenes.map(s=>[s.id,s]));
let selected=D.scenes.find(s=>s.category==='主线剧情').id,lang='cn',page=0,mode='read',lastFocus=null;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const display=(t,fallback='')=>t[lang]||fallback;
const actorNames=new Map();
D.scenes.forEach(s=>{s.search=[s.id,s.title,s.group,...s.clips.flatMap(c=>c.lines.flatMap(l=>[l.text.cn,l.text.en,l.speaker.cn,l.speaker.en]))].join(' ').toLowerCase();s.clips.forEach(c=>c.actors.forEach(a=>{if(a.portrait)actorNames.set(a.portrait,[a.name.cn,a.name.en,a.alias].join(' '));}));});
D.assets.forEach(a=>a.search=[a.name,...a.names,a.category,...a.scenes,actorNames.get(a.id)||''].join(' ').toLowerCase());
function imageCard(id,links=false,large=false){const a=assets.get(id),figure=el('figure','image-card'),button=el('button'),image=el('img');button.type='button';button.setAttribute('aria-label','查看 '+a.name);image.src=large?a.image:a.thumbnail;image.alt=a.name;image.loading='lazy';image.width=a.width;image.height=a.height;button.append(image);button.onclick=()=>openImage(id);figure.append(button);const caption=el('figcaption');caption.append(el('span','badge',a.category),el('span','',a.name));if(links){caption.append(el('div','muted',a.proportion));const linksBox=el('div');a.scenes.slice(0,2).forEach(scene=>{const link=el('a','',scene.toUpperCase());link.href='#scene='+encodeURIComponent(scene);linksBox.append(link);});if(a.scenes.length>2)linksBox.append(el('span','muted','等 '+a.scenes.length+' 场'));caption.append(linksBox);}figure.append(caption);return figure;}
function grid(ids,large=false){const n=el('div','image-grid'+(large?' backgrounds':''));ids.forEach(id=>n.append(imageCard(id,false,large)));return n;}
function openImage(id){const a=assets.get(id);lastFocus=document.activeElement;$('image-title').textContent=a.name+' · '+a.category;const image=$('image-full');image.src=a.image;image.alt=a.name;image.width=a.width;image.height=a.height;$('image-original').href=a.image;$('image-stage').classList.remove('dark');$('image-background').textContent='深色底';$('image-info').replaceChildren(el('p','',a.proportion+' · '+a.width+' × '+a.height+'。按片段归档，未确定逐句显示时刻。'));a.scenes.forEach(id=>{const s=scenes.get(id),link=el('a','',s.title);link.href='#scene='+encodeURIComponent(id);link.onclick=()=>$('image-dialog').close();$('image-info').append(link);});if(!a.scenes.length)$('image-info').append(el('p','muted','本包内的补充资料素材，尚无本阅读页中的对应场次。'));$('image-dialog').showModal();}
function filteredScenes(){const q=$('story-search').value.trim().toLowerCase(),category=$('story-category').value,rank={'主线剧情':0,'活动与支线剧情':1,'测试剧情':2,'独立片段':3};return D.scenes.filter(s=>(!q||s.search.includes(q))&&(!category||s.category===category)).sort((a,b)=>rank[a.category]-rank[b.category]);}
function renderList(){const list=$('scene-list'),visible=filteredScenes();list.replaceChildren();$('story-count').textContent=visible.length+' / '+D.scenes.length+' 场剧情';const groups=new Map();visible.forEach(s=>{const key=s.category+' / '+s.group;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);});for(const [label,items] of groups){const group=el('details');group.open=items.some(s=>s.id===selected)||Boolean($('story-search').value);group.append(el('summary','',label+' · '+items.length));items.forEach(s=>{const b=el('button','scene-link'+(s.id===selected?' selected':''),s.title);b.type='button';b.dataset.scene=s.id;b.onclick=()=>goScene(s.id);group.append(b);});list.append(group);}if(!visible.length)list.append(el('p','empty','没有找到匹配的剧情。'));}
function goScene(id,clip){const params=new URLSearchParams({scene:id});if(clip!==undefined)params.set('clip',clip);const hash='#'+params.toString();if(location.hash===hash){readHash();return;}location.hash=hash;}
const voicePlayer=$('voice-player');let voiceButton=null,voiceRequest=0;
function stopVoice(){voiceRequest++;voicePlayer.pause();voicePlayer.removeAttribute('src');voicePlayer.load();if(voiceButton){voiceButton.textContent=voiceButton.dataset.label;voiceButton.setAttribute('aria-pressed','false');}voiceButton=null;}
function failedVoice(){if(!voiceButton)return;const button=voiceButton;stopVoice();button.textContent=lang==='en'?'Retry voice':'播放失败，点击重试';}
async function playVoice(button,src){if(voiceButton===button){stopVoice();return;}stopVoice();const token=voiceRequest;voiceButton=button;button.textContent=lang==='en'?'Loading…':'加载中…';button.setAttribute('aria-pressed','true');voicePlayer.src=src;try{await voicePlayer.play();if(token===voiceRequest)button.textContent=lang==='en'?'Stop voice':'停止播放';}catch(error){if(token===voiceRequest)failedVoice();}}
voicePlayer.addEventListener('ended',stopVoice);voicePlayer.addEventListener('error',()=>{if(voicePlayer.error)failedVoice();});window.addEventListener('pagehide',stopVoice);
function renderScene(){stopVoice();const s=scenes.get(selected),reader=$('reader');reader.replaceChildren();reader.append(el('div','kicker',s.category+' / '+s.group),el('h2','',s.title));const count=s.clips.reduce((n,c)=>n+c.lines.length,0);reader.append(el('p','muted',s.clips.length+' 个片段 · '+count+' 条文案'));reader.append(el('p','notice','背景与图片按片段实际引用归档，不代表逐句截图。角色资料立绘用于辨认人物，动态表情与动作未重建。文字图有时保留游戏中的繁体字形。'));
if(V.stats?.lines)reader.append(el('p','voice-notice',lang==='en'?'Voice buttons play the original game audio. Some clips may be short reactions.':'有按钮的台词可播放原游戏语音，部分为短句或语气音。'));for(const c of s.clips){const block=el('section','clip');block.id='clip-'+c.order;const heading=el('h3');heading.append(el('span','clip-num','片段 '+(c.order||1)),document.createTextNode(c.id.toUpperCase()));block.append(heading);
const backgrounds=c.assets.filter(id=>assets.get(id).category==='场景背景');if(backgrounds.length){block.append(el('div','section-label','本片段背景 · 点击查看大图'),grid(backgrounds,true));}
const illustrations=c.assets.filter(id=>assets.get(id).category==='剧情插图与特写');if(illustrations.length){block.append(el('div','section-label','本片段插图与特写 · 并非逐句截图'),grid(illustrations,true));}
if(c.actors.length){block.append(el('div','section-label','出场人物 · 配图为角色资料立绘'));const actors=el('div','actors');c.actors.forEach(a=>{const item=el('div','actor');if(a.portrait){const button=el('button'),image=el('img'),asset=assets.get(a.portrait);button.setAttribute('aria-label','查看 '+display(a.name,a.alias)+' 资料立绘');image.src=asset.thumbnail;image.alt='';image.loading='lazy';button.append(image);button.onclick=()=>openImage(a.portrait);item.append(button);}item.append(el('span','',display(a.name,a.alias)));actors.append(item);});block.append(actors);}
const dialogue=el('div','dialogue');if(!c.lines.length)dialogue.append(el('p','muted','本片段没有匹配到非空对白；图片仍按原片段保留。'));c.lines.forEach(l=>{const text=display(l.text),narration=!display(l.speaker),line=el('div','line'+(narration?' narration':''));line.dataset.entry=l.entry;line.dataset.textId=l.id;const speaker=el('span','speaker',display(l.speaker,narration?'旁白 / 场景文字':''));line.append(speaker);const voice=V.clips[V.lines[l.entry]];if(voice){const b=el('button','voice-button',lang==='en'?'Play voice':'播放原声');b.type='button';b.dataset.entry=l.entry;b.dataset.label=b.textContent;b.setAttribute('aria-pressed','false');b.title='原游戏语音，部分为短句或语气音';b.onclick=()=>playVoice(b,voice.src);line.append(b);}if(l.time==='')line.append(el('time','','时刻未确认'));else{const seconds=Number(l.time),label=Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0');line.append(el('time','',label));}line.append(el('p',text?'':'muted',text||(lang==='cn'?'此条中文原文为空。':'No English text in this entry.')));dialogue.append(line);});block.append(dialogue);
const other=c.assets.filter(id=>!backgrounds.includes(id)&&!illustrations.includes(id));if(other.length){const detail=el('details','materials');detail.append(el('summary','', '查看本片段 '+other.length+' 张文字图与演出素材'));detail.append(el('p','muted','包含旁白文字图、字形分片、道具和特效组成纹理；原始分片并非完整画面。'),grid(other));block.append(detail);}reader.append(block);}
const visible=filteredScenes(),index=visible.findIndex(x=>x.id===s.id),nav=el('nav','scene-nav');[['上一场',index-1],['下一场',index+1]].forEach(([label,i])=>{const b=el('button','',label);b.disabled=index<0||i<0||i>=visible.length;b.onclick=()=>goScene(visible[i].id);nav.append(b);});reader.append(nav);}
function filteredImages(){const q=$('image-search').value.trim().toLowerCase(),cat=$('image-category').value;return D.assets.filter(a=>(!q||a.search.includes(q))&&(!cat||a.category===cat));}
function renderGallery(){const images=filteredImages(),pages=Math.max(1,Math.ceil(images.length/24));page=Math.min(page,pages-1);$('image-count').textContent=images.length+' / '+D.assets.length+' 张图片（按内容、用途与比例去重）';$('gallery-grid').replaceChildren(...images.slice(page*24,(page+1)*24).map(a=>imageCard(a.id,true)));if(!images.length)$('gallery-grid').append(el('p','empty','没有找到匹配图片。'));$('page-count').textContent=(page+1)+' / '+pages;$('previous-page').disabled=page===0;$('next-page').disabled=page>=pages-1;}
function readHash(){stopVoice();if($('image-dialog').open)$('image-dialog').close();const params=new URLSearchParams(location.hash.slice(1));mode=location.hash.startsWith('#gallery')?'gallery':'read';if(params.has('scene')&&scenes.has(params.get('scene')))selected=params.get('scene');$('reading').hidden=mode!=='read';$('gallery').hidden=mode!=='gallery';$('read-tab').classList.toggle('active',mode==='read');$('gallery-tab').classList.toggle('active',mode==='gallery');if(mode==='gallery')renderGallery();else{const s=scenes.get(selected);if($('story-category').value&&$('story-category').value!==s.category)$('story-category').value='';if($('story-search').value&&!s.search.includes($('story-search').value.trim().toLowerCase()))$('story-search').value='';renderList();renderScene();if(params.has('clip'))requestAnimationFrame(()=>$('clip-'+params.get('clip'))?.scrollIntoView({block:'start'}));else window.scrollTo(0,0);}}
for(const cat of Object.keys(D.stats.categories)){$('image-category').append(new Option(cat,cat));}
$('read-tab').onclick=()=>goScene(selected);$('gallery-tab').onclick=()=>{location.hash='gallery';};$('language').onchange=()=>{lang=$('language').value;if(mode==='read')renderScene();};$('story-search').oninput=renderList;$('story-category').onchange=renderList;$('image-search').oninput=()=>{page=0;renderGallery();};$('image-category').onchange=()=>{page=0;renderGallery();};$('previous-page').onclick=()=>{page--;renderGallery();};$('next-page').onclick=()=>{page++;renderGallery();};$('image-close').onclick=()=>$('image-dialog').close();$('image-dialog').addEventListener('close',()=>lastFocus?.focus());$('image-background').onclick=()=>{const dark=$('image-stage').classList.toggle('dark');$('image-background').textContent=dark?'浅色底':'深色底';};$('image-dialog').addEventListener('click',e=>{if(e.target===$('image-dialog'))$('image-dialog').close();});window.addEventListener('hashchange',readHash);readHash();
</script>
