<script>
'use strict';
const dataElement = document.getElementById('album-data');
const ARTWORKS = JSON.parse(dataElement.textContent);
dataElement.remove();
const byId = id => document.getElementById(id);
const PAGE_SIZE = 24;
const grid = byId('grid'), search = byId('search'), reader = byId('reader');
let mode = 'all', page = 0, visible = ARTWORKS.slice(), current = -1, opener = null;

function updateSelection() {
  const query = search.value.trim().toLocaleLowerCase();
  visible = ARTWORKS.filter(item => (mode === 'all' || (mode === 'story' ? !!item.story : !item.story)) &&
    (!query || `${item.title}\n${item.story}\n${item.numbering}`.toLocaleLowerCase().includes(query)));
  page = 0;
  render();
}

function render() {
  const pages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  page = Math.min(page, pages - 1);
  grid.replaceChildren();
  const start = page * PAGE_SIZE;
  visible.slice(start, start + PAGE_SIZE).forEach((item, offset) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'art-card';
    button.dataset.id = item.id;
    button.setAttribute('aria-label', `阅读《${item.title}》`);
    const image = document.createElement('img');
    image.className = 'thumb'; image.src = item.thumbnail; image.alt = item.title;
    image.loading = 'lazy'; image.decoding = 'async'; image.width = 480; image.height = 360;
    const copy = document.createElement('span'); copy.className = 'card-copy';
    const meta = document.createElement('span'); meta.className = 'card-meta';
    meta.textContent = [item.numbering, item.story ? '插画与故事' : '插画'].filter(Boolean).join(' · ');
    const title = document.createElement('span'); title.className = 'card-title'; title.textContent = item.title;
    const excerpt = document.createElement('span'); excerpt.className = 'excerpt';
    excerpt.textContent = item.story ? item.story.replace(/\s+/g, ' ') : '这幅插画暂无配文。';
    copy.append(meta, title, excerpt); button.append(image, copy);
    button.addEventListener('click', () => { opener = button; openArtwork(start + offset); });
    grid.append(button);
  });
  if (!visible.length) {
    const empty = document.createElement('p'); empty.className = 'empty';
    empty.textContent = '没有找到相关插画，换个关键词试试。'; grid.append(empty);
  }
  byId('result').textContent = visible.length ? `共 ${visible.length} 幅 · 正在浏览 ${start + 1}–${Math.min(start + PAGE_SIZE, visible.length)} 幅` : '没有匹配的插画';
  byId('page-position').textContent = `${page + 1} / ${pages}`;
  byId('page-prev').disabled = page === 0;
  byId('page-next').disabled = page >= pages - 1;
}

function openArtwork(index) {
  if (index < 0 || index >= visible.length) return;
  current = index;
  const item = visible[current];
  byId('full-art').src = item.image; byId('full-art').alt = item.title;
  byId('story-title').textContent = item.title;
  byId('story-number').textContent = item.numbering;
  byId('story-text').textContent = item.story || '这幅插画暂无配文。';
  byId('story-text').classList.toggle('no-story', !item.story);
  byId('reader-position').textContent = `${current + 1} / ${visible.length}`;
  byId('art-prev').disabled = current === 0;
  byId('art-next').disabled = current === visible.length - 1;
  byId('save-art').href = item.image;
  if (item.image.startsWith('data:')) {
    byId('save-art').textContent = '保存插画';
    byId('save-art').download = `${item.title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')}.webp`;
    byId('save-art').removeAttribute('target');
  } else {
    byId('save-art').textContent = '查看大图';
    byId('save-art').removeAttribute('download');
    byId('save-art').target = '_blank';
    byId('save-art').rel = 'noopener';
  }
  byId('reader-body').scrollTop = 0;
  if (!reader.open) { reader.showModal(); document.body.style.overflow = 'hidden'; byId('close').focus(); }
  history.replaceState(null, '', `#${encodeURIComponent(item.id)}`);
}

function selectMode(nextMode) {
  mode = nextMode;
  document.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === mode)));
  updateSelection();
}
search.addEventListener('input', updateSelection);
document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => selectMode(button.dataset.filter)));
function movePage(delta) { page += delta; render(); byId('result').scrollIntoView({block: 'start'}); }
byId('page-prev').addEventListener('click', () => movePage(-1));
byId('page-next').addEventListener('click', () => movePage(1));
byId('art-prev').addEventListener('click', () => openArtwork(current - 1));
byId('art-next').addEventListener('click', () => openArtwork(current + 1));
byId('close').addEventListener('click', () => reader.close());
reader.addEventListener('click', event => { if (event.target === reader) reader.close(); });
reader.addEventListener('close', () => {
  document.body.style.overflow = '';
  history.replaceState(null, '', location.href.split('#')[0]);
  byId('full-art').removeAttribute('src');
  if (opener?.isConnected) opener.focus();
});
reader.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') { event.preventDefault(); openArtwork(current - 1); }
  if (event.key === 'ArrowRight') { event.preventDefault(); openArtwork(current + 1); }
});
function followBookmark() {
  const requested = location.hash.slice(1);
  if (!ARTWORKS.some(item => item.id === requested)) return;
  if (!visible.some(item => item.id === requested)) { search.value = ''; selectMode('all'); }
  openArtwork(visible.findIndex(item => item.id === requested));
}
render();
window.addEventListener('hashchange', followBookmark);
followBookmark();
</script>
